version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# FINAI — Ambiente di sviluppo locale con Docker Compose
#
# Avvio: docker compose up -d
# Poi:   cd backend && mvn spring-boot:run
#        cd frontend && npm run dev
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       finai
      POSTGRES_USER:     finai
      POSTGRES_PASSWORD: finai
    ports:
      - "5432:5432"
    volumes:
      - finai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai -d finai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PgAdmin (opzionale, per ispezione visuale del DB) ─────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@finai.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev-tools    # Avvia solo con: docker compose --profile dev-tools up -d

volumes:
  finai_pgdata:
    driver: local
