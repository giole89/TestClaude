# ─────────────────────────────────────────────────────────────────────────────
# FINAI — Stack completo: PostgreSQL + Backend Java + Frontend React
#
# Prerequisiti: Docker Desktop installato
#
# Avvio rapido:
#   1. Copia .env.example in .env e inserisci ANTHROPIC_API_KEY
#   2. docker compose up -d --build
#   3. Apri http://localhost:5173
#
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Reset DB: docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       finai
      POSTGRES_USER:     finai
      POSTGRES_PASSWORD: finai
    volumes:
      - finai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai -d finai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Backend Java / Spring Boot ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finai-backend
    restart: unless-stopped
    environment:
      DB_URL:             jdbc:postgresql://postgres:5432/finai
      DB_USER:            finai
      DB_PASSWORD:        finai
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      AI_MODEL:           ${AI_MODEL:-claude-haiku-4-5-20251001}
      PORT:               3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend React / Vite ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finai-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

  # ── PgAdmin (opzionale) ────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@finai.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev-tools

volumes:
  finai_pgdata:
    driver: local
