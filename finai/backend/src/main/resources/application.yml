spring:
  application:
    name: finai-backend

  # ── Datasource ──────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finai}
    username: ${DB_USER:finai}
    password: ${DB_PASSWORD:finai}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
      initialization-fail-timeout: 60000  # aspetta fino a 60s per la prima connessione (Docker startup)

  # ── JPA ─────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gestisce lo schema; Hibernate solo valida
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway ───────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Cache (Caffeine) ─────────────────────────────────────────────────────
  cache:
    type: caffeine
    cache-names:
      - quotes          # TTL 60s  — quote singole
      - batch           # TTL 120s — batch di quote
      - history         # TTL 4h   — storico prezzi
      - search          # TTL 30s  — autocomplete ticker
      - ipo             # TTL 1h   — calendario IPO
      - ai              # TTL 30m  — risposte AI
      - earnings        # TTL 6h   — date earnings (cambiano raramente)
      - dividends       # TTL 24h  — dati dividendi
      - screener        # TTL 5m   — screener azionario
      - news            # TTL 15m  — news finanziarie
      - benchmark       # TTL 1h   — benchmark vs S&P 500
      - correlation     # TTL 4h   — correlazione portafoglio
      - watchlist       # TTL 60s  — watchlist
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

  # ── Threads virtuali (Java 21) ───────────────────────────────────────────
  threads:
    virtual:
      enabled: true

  # ── Jackson ──────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${PORT:3001}
  error:
    include-message: on_param       # messaggio solo se ?message presente (non in produzione)
    include-binding-errors: never   # mai esporre dettagli di binding al client

# ── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info  # metrics e caches rimossi: esporrebbero dati interni senza auth
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.finai: INFO
    org.springframework.web.reactive.function.client: WARN
    io.github.resilience4j: WARN

# ── Finai custom config ───────────────────────────────────────────────────────
finai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-haiku-4-5-20251001}
    base-url: https://api.anthropic.com
    max-tokens: 1024
    version: "2023-06-01"
  yahoo:
    base-url-v7: https://query1.finance.yahoo.com/v7/finance
    base-url-v8: https://query1.finance.yahoo.com/v8/finance
    base-url-search: https://query1.finance.yahoo.com/v1/finance
    timeout-seconds: 10
  nasdaq:
    base-url: https://api.nasdaq.com/api/ipo
    timeout-seconds: 15
  rate-limit:
    global-per-minute: 100
    ai-per-minute: 20

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  retry:
    instances:
      yahooFinance:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
      nasdaq:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      yahooFinance:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 100
      nasdaq:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 120s

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}   # disabilitato di default; attivare solo in dev
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
